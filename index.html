<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Humanity Connect</title>
<link rel="icon" type="image/png" href="Logo.png">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<style>
:root{--primary:#1E40AF;--cta:#EA580C;--bg:#F8FAFC;--edu:#2563EB;--blood:#DC2626;--zakat:#7C3AED;--ink:#0f172a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:70px;scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:'Inter','Hind Siliguri',sans-serif}
body.bn{font-family:'Hind Siliguri','Inter',sans-serif}
.bp{background:var(--primary)}.tp{color:var(--primary)}.bc{background:var(--cta)}.btn.bc{color:#fff!important}.be{background:var(--edu)}.te{color:var(--edu)}.bb{background:var(--blood)}.tb{color:var(--blood)}.bz{background:var(--zakat)}.tz{color:var(--zakat)}
.inp{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:8px 10px;background:#fff;font-size:14px}
.btn{border-radius:8px;padding:8px 16px;font-weight:600;color:#fff;font-size:14px}
.btn:disabled{opacity:.4}
.card{background:#fff;border-radius:14px;border:1px solid #e2e8f0;padding:16px}
@keyframes tick{from{transform:translateX(100%)}to{transform:translateX(-100%)}}.tick{display:inline-block;white-space:nowrap;animation:tick 28s linear infinite}@media(prefers-reduced-motion:reduce){.tick{animation:none}}@media print{body *{visibility:hidden}#print,#print *{visibility:visible}#print{position:absolute;left:0;top:0;width:100%}}
</style></head><body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,createContext,useContext}=React;

/* ========= THEME & TEXT CONFIG: edit here ========= */
const THEME={name:'Humanity Connect',colors:{'--primary':'#1E40AF','--cta':'#EA580C','--bg':'#F8FAFC','--edu':'#2563EB','--blood':'#DC2626','--zakat':'#7C3AED'}};
const GFORM_URL="https://docs.google.com/forms/d/e/1FAIpQLSfQ0iEyvBp_RHAfp81YZTv1f27I3DOHxkpuyBlPNWcpvHs1lQ/viewform?usp=header";
const MY_ACCOUNTS = {
  'bKash': '01324205584 (Personal - Send Money)',
  'Nagad': '01324205584 (Personal - Send Money)',
  'Rocket': '01324205584-0 (Personal - Send Money)',
  'Upay': 'pending (Personal)',
  'Local Bank / Card': 'Dutch Bangla Bank | A/C: 2061510357774 | Name: MD. Atabur Rahman Lanju'
};
const L={
en:{tag:'Together We Can Make a Difference',home:'Home',about:'About',camp:'Campaigns',edu:'Education Support',trans:'Transparency Reports',comm:'Community & Blood Bank',proof:'Proof Gallery',tools:'Zakat & Tools',dash:'Dashboards',more:'View Full Details',back:'Back to Home',contact:'Contact',join:'Login / Join',
hero:'Connecting compassionate donors, dedicated volunteers, and bright students on one transparent platform. Every taka accounted for, every life empowered.',donate:'Donate Now',vol:'Become a Volunteer',
demo:'Welcome to Humanity Connect! Together, every small act of kindness creates a brighter tomorrow. Thank you for being part of our compassionate journey.',
s1:'Total Collected',s2:'Total Expenses',s3:'Available Balance',s4:'Active Members',s5:'Beneficiaries Helped'},
bn:{tag:'একসাথে আমরা পরিবর্তন আনতে পারি',home:'হোম',about:'আমাদের সম্পর্কে',camp:'ক্যাম্পেইন',edu:'শিক্ষা সহায়তা',trans:'স্বচ্ছতা প্রতিবেদন',comm:'কমিউনিটি ও রক্তদান',proof:'প্রমাণ গ্যালারি',tools:'যাকাত ও টুলস',dash:'ড্যাশবোর্ড',more:'বিস্তারিত দেখুন',back:'হোমে ফিরুন',contact:'যোগাযোগ',join:'লগইন / যোগ দিন',
hero:'আপনার প্রতিটি অনুদানের স্বচ্ছ হিসাব এবং সঠিক ব্যবহার নিশ্চিত করতে আমরা অঙ্গীকারবদ্ধ। আসুন, অসহায় মানুষের পাশে দাঁড়াই এবং দরিদ্র মেধাবী শিক্ষার্থীদের স্বপ্ন পূরণের সারথি হই।',donate:'এখনই দান করুন',vol:'স্বেচ্ছাসেবক হোন',
demo:'হিউম্যানিটি কানেক্টে আপনাকে স্বাগতম! আপনার সামান্য ভালোবাসা ও সহযোগিতা কারো জীবনে বড় পরিবর্তন আনতে পারে। আমাদের এই মানবিক যাত্রায় পাশে থাকার জন্য আন্তরিক ধন্যবাদ।',
s1:'মোট সংগ্রহ',s2:'মোট ব্যয়',s3:'বর্তমান জমা',s4:'সক্রিয় সদস্য',s5:'উপকারভোগী'}};
const Ctx=createContext();const useT=()=>useContext(Ctx);
const money=n=>'৳'+Number(n).toLocaleString('en-IN');
const DISTRICTS=['Dhaka','Chattogram','Sylhet','Rajshahi','Khulna','Barishal','Rangpur','Mymensingh'];
const BG=['A+','A-','B+','B-','O+','O-','AB+','AB-'];
const now=()=>new Date().toLocaleString();

/* ========= small UI helpers ========= */
const Sec=({id,title,color='var(--primary)',children,sub})=>(<section id={id} className="max-w-6xl mx-auto px-4 py-10"><h2 className="text-2xl font-extrabold mb-1" style={{color}}>{title}</h2>{sub&&<p className="text-slate-600 mb-4 text-sm max-w-2xl">{sub}</p>}<div className="mt-4">{children}</div></section>);
const Bar=({v,max,color='var(--primary)'})=>(<div className="h-2.5 bg-slate-200 rounded-full overflow-hidden"><div className="h-full rounded-full" style={{width:Math.min(100,v/max*100)+'%',background:color}}/></div>);
const Modal=({onClose,children,title})=>(<div className="fixed inset-0 z-50 bg-black/50 flex items-start justify-center overflow-auto p-3" onClick={onClose}><div className="card w-full max-w-lg mt-6" onClick={e=>e.stopPropagation()}><div className="flex justify-between mb-3"><h3 className="font-extrabold text-lg">{title}</h3><button onClick={onClose} className="text-xl px-2">×</button></div>{children}</div></div>);
const Fld=({l,children})=><label className="block text-sm font-semibold mb-2">{l}{children}</label>;
function useCount(t){const[v,s]=useState(0);useEffect(()=>{let f=0;const id=setInterval(()=>{f++;s(Math.round(t*Math.min(1,f/40)));if(f>=40)clearInterval(id)},25);return()=>clearInterval(id)},[t]);return v}
function PhotoPick({onPick,label='Profile photo'}){const[src,setSrc]=useState(null);return(<Fld l={label}><input type="file" accept="image/*" className="inp" onChange={e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{setSrc(r.result);onPick(r.result)};r.readAsDataURL(f)}}/>{src&&<img src={src} className="w-20 h-20 rounded-full object-cover mt-2" alt="preview"/>}</Fld>)}
const Avatar=({m})=>m.photo?<img src={m.photo} className="w-10 h-10 rounded-full object-cover" alt=""/>:<div className="w-10 h-10 rounded-full bp text-white flex items-center justify-center font-bold">{m.name[0]}</div>;
const Print=()=><button className="btn bp" onClick={()=>window.print()}>Print / Save as PDF</button>;

/* ========= App ========= */
function App(){
const[lang,setLang]=useState('en');
const t=k=>L[lang][k]||L.en[k]||k;
const PAGES=['home','campaigns','education','transparency','proof-gallery','community','tools','dashboard'];
const[page,setPage]=useState(()=>{const h=(location.hash||'').slice(1);return PAGES.includes(h)?h:'home'});
const[camp,setCamp]=useState(null);const[dcamp,setDcamp]=useState('');const[dpre,setDpre]=useState({});
const go=(p,cid=null)=>{setCamp(cid);setPage(p);try{history.replaceState(null,'','#'+p)}catch(e){}};
useEffect(()=>{window.scrollTo(0,0)},[page,camp]);
useEffect(()=>{const h=()=>{const x=location.hash.slice(1);if(PAGES.includes(x)){setCamp(null);setPage(x)}};window.addEventListener('hashchange',h);return()=>window.removeEventListener('hashchange',h)},[]);
const[modal,setModal]=useState(null);
const[adminOK,setAdminOK]=useState(false);
const[cats]=useState([['Education',150000,'var(--edu)'],['Food',100000,'#16a34a'],['Medical Support',90000,'var(--blood)'],['Emergency Relief',110000,'var(--cta)'],['Others',50000,'#64748b']]);
const[donations,setDonations]=useState([{id:'D-1001',name:'Rahim U.',amt:2000,anon:false,fund:'General',ok:true,t:'2 hrs ago'},{id:'D-1002',name:'Anonymous',amt:500,anon:true,fund:'General',ok:true,t:'5 hrs ago'},{id:'D-1003',name:'Sadia K.',amt:5000,anon:false,fund:'Zakat',ok:true,t:'1 day ago'}]);
const[members,setMembers]=useState([{id:1,name:'Tanvir Ahmed',role:'Volunteer',district:'Dhaka',phone:'01700-000001',bg:'O+',cat:'Volunteer',consent:true},{id:2,name:'Nusrat Jahan',role:'Member',district:'Sylhet',phone:'01800-000002',bg:'A+',cat:'Monthly Donor',consent:true},{id:3,name:'Imran Hossain',role:'Member',district:'Chattogram',phone:'01900-000003',bg:'B+',cat:'Donor Member',consent:true},{id:4,name:'Farhana Akter',role:'Volunteer',district:'Dhaka',phone:'01600-000004',bg:'AB+',cat:'Volunteer',consent:true}]);
const[expenses,setExpenses]=useState([{id:1,proj:'Winter Clothes Drive',amt:45000,date:'2026-11-02',loc:'Rangpur',cat:'Emergency Relief',receipt:null},{id:2,proj:'School Books & Stationery',amt:30000,date:'2026-10-18',loc:'Dhaka',cat:'Education',receipt:null},{id:3,proj:'Free Medical Camp',amt:60000,date:'2026-09-27',loc:'Sylhet',cat:'Medical Support',receipt:null}]);
const[camps,setCamps]=useState([{id:1,name:'Winter Clothes for 500 Families',target:300000,got:185000,crit:'Verified by union council + 2 volunteer home visits'},{id:2,name:'Medical Aid: Child Surgery Fund',target:150000,got:92000,crit:'Hospital letter + doctor prescription verified'},{id:3,name:'Flood Relief: Sunamganj',target:400000,got:128000,crit:'Upazila admin list + field team check'},{id:4,name:'Ramadan Iftar Packs',target:100000,got:100000,crit:'Beneficiary list checked by local mosque committee'},{id:5,name:'School Uniform Drive',target:80000,got:80000,crit:'Headteacher letter + volunteer visits'}]);
const[proofs,setProofs]=useState([{id:1,title:'Winter blanket distribution',cost:'৳45,000: blankets ৳38,000, transport ৳7,000',loc:'Rangpur',kind:'photo',src:null},{id:2,title:'Book handover to 40 students',cost:'৳30,000: books ৳26,000, bags ৳4,000',loc:'Dhaka',kind:'video',src:null}]);
const[fb,setFb]=useState([{id:1,type:'Suggestion',text:'Please add Sylhet volunteer team.',status:'Under Review'},{id:2,type:'Review',text:'Great transparency on expenses!',status:'Resolved'}]);
const[audit,setAudit]=useState([{who:'System',what:'Platform initialised (demo)',at:now()}]);
const[team,setTeam]=useState([{id:1,name:'Mohammad Ali',role:'Founder & CEO',photo:'Mohammad Ali.jpg',link:'https://mohammadali239.github.io/Mohammad-Ali/'},{id:2,name:'Ayesha Siddika',role:'Programs Lead',photo:null},{id:3,name:'Kamal Hossain',role:'Finance & Transparency',photo:null},{id:4,name:'Mitu Rahman',role:'Volunteer Coordinator',photo:null}]);
const[zakatPool,setZakatPool]=useState(5000);
const[me,setMe]=useState({name:'Demo Donor',cat:'Donor Member',photo:null,hide:false,monthly:[500,500,1000,500,500,1000]});
const log=(what)=>setAudit(a=>[{who:'Admin (demo)',what,at:now()},...a]);
const raised=50000+donations.filter(d=>d.ok&&d.fund==='General'&&Number(d.id.slice(2))>1003).reduce((s,d)=>s+d.amt,0);
const spent=20000+expenses.filter(e=>e.id>3).reduce((s,e)=>s+e.amt,0);
const ctx={go,page,camp,setCamp,dcamp,setDcamp,dpre,setDpre,lang,t,donations,setDonations,members,setMembers,expenses,setExpenses,camps,setCamps,proofs,setProofs,fb,setFb,audit,log,zakatPool,setZakatPool,me,setMe,setModal,cats,raised,spent,adminOK,setAdminOK,team,setTeam};
useEffect(()=>{Object.entries(THEME.colors).forEach(([k,v])=>document.documentElement.style.setProperty(k,v));document.body.className=lang==='bn'?'bn':''},[lang]);
const nav=[['home','home'],['camp','campaigns'],['edu','education'],['trans','transparency'],['proof','proof-gallery'],['comm','community'],['tools','tools'],['dash','dashboard']];
return(<Ctx.Provider value={ctx}>
<div className="bg-emerald-700 text-base py-2 font-bold text-white overflow-hidden"><div className="tick">{t('demo')}</div></div><header className="sticky top-0 z-40 bg-white border-b shadow-sm">
<div className="max-w-6xl mx-auto px-4 py-2 flex items-center gap-3 flex-wrap">
<button onClick={()=>go('home')} className="font-extrabold text-lg tp flex items-center gap-2"><img src="Logo.png" alt="Logo" className="w-8 h-8 object-contain"/><span>{THEME.name}</span></button>
<nav className="hidden lg:flex gap-1 text-sm font-semibold flex-1">{nav.map(([k,p])=><button key={k} onClick={()=>go(p)} className={'px-2.5 py-1 rounded-full '+(page===p?'bp text-white':'text-slate-600 hover:bg-slate-100')}>{t(k)}</button>)}</nav>
<div className="flex gap-2 ml-auto items-center">

<button className="border rounded-full px-3 py-1 text-sm font-bold" onClick={()=>setLang(lang==='en'?'bn':'en')}>{lang==='en'?'বাংলা':'EN'}</button>
<button className="btn bp" onClick={()=>setModal('reg')}>{t('join')}</button></div></div>
<nav className="lg:hidden flex gap-2 overflow-x-auto px-4 pb-2 text-xs font-semibold whitespace-nowrap">{nav.map(([k,p])=><button key={k} onClick={()=>go(p)} className={'px-2.5 py-1 rounded-full '+(page===p?'bp text-white':'bg-slate-100 text-slate-600')}>{t(k)}</button>)}</nav></header>
<Router/>
<Contact/><Footer/>
{modal==='donate'&&<DonateModal/>}{modal==='reg'&&<RegModal/>}
</Ctx.Provider>)}

/* ========= Public page ========= */
function Home(){const{t,setModal,go}=useT();return(<main id="home">
<div className="text-white bg-cover bg-center" style={{backgroundImage:"linear-gradient(rgba(15,23,42,0.68),rgba(30,64,175,0.75)),url('Humanity Connect Background Photo.png')"}}><div className="max-w-6xl mx-auto px-4 py-16 md:py-24"><h1 className="text-2xl md:text-4xl font-extrabold max-w-4xl leading-snug">{t('hero')}</h1><p className="mt-3 opacity-90">{t('tag')}</p>
<div className="flex gap-3 mt-6 flex-wrap"><button className="btn bc !text-slate-900 !px-6 !py-3" onClick={()=>setModal('donate')}>{t('donate')}</button><a href={GFORM_URL} target="_blank" rel="noreferrer" className="btn !px-6 !py-3 border border-white">{t('vol')}</a></div></div></div>
<Stats/><HomeCamps/><NavCards/>
</main>)}

/* ========= Multi-page system ========= */
const CMETA={1:{cat:'Emergency',story:'Winter nights in the north are freezing. Funds buy blankets, sweaters and socks locally. Volunteers hand them over against a signed beneficiary list.',donors:['Rahim U.','Anonymous','Sadia K.']},2:{cat:'Medical',story:'A seven-year-old needs urgent heart surgery. Money is paid straight to the hospital, never to individuals.',donors:['Nusrat J.','Anonymous']},3:{cat:'Emergency',story:'Floods have cut off villages in Sunamganj. We supply dry food, clean water and shelter kits.',donors:['Imran H.','Anonymous','Tanvir A.']},4:{cat:'Food',status:'Completed',story:'Iftar packs reached 400 families during Ramadan. Fully funded and delivered.',donors:['Farhana A.','Anonymous']},5:{cat:'Education',status:'Completed',story:'School uniforms and shoes for 120 students. Fully funded and delivered.',donors:['Anonymous','Kamal H.']}};
const CCATS=['All','Emergency','Medical','Education','Food'];
const cmeta=c=>({cat:'General',story:'The full story for this campaign will be published by the admin team.',donors:[],...(CMETA[c.id]||{})});
const cstatus=c=>(CMETA[c.id]&&CMETA[c.id].status)||(c.got>=c.target?'Completed':'Active');
const ICONS={video:'▶ Video update',photo:'📷 Distribution photo',bill:'🧾 Official bill'};
const MONTHS=[['November 2026',60000,35000],['October 2026',120000,75000],['September 2026',90000,60000]];
const NAVC=[['education','🎓','Education Support','Scholarships, mentors and anonymised student stories.'],['transparency','📊','Transparency & Reports','Fund ledgers, expense receipts and monthly reports.'],['proof-gallery','🎥','Proof Gallery','Videos, photos and bills showing where money went.'],['community','🤝','Community & Blood Bank','Directory, volunteers and blood donors.'],['tools','🧮','Zakat & Tools','Zakat calculator, impact slider, gift cards and FAQ.'],['dashboard','👤','Dashboards','Your donor profile and the admin panel.']];
const Pill=({on,children,...p})=><button {...p} className={'rounded-full border px-3 py-1 text-sm '+(on?'bp text-white':'bg-white')}>{children}</button>;
const Media=({p})=>p.src?(p.kind==='video'?<video src={p.src} controls className='w-full h-full object-cover'/>:<img src={p.src} className='w-full h-full object-cover' alt={p.title}/>):<span>{ICONS[p.kind]}</span>;

function CampCard({c}){const{go,t,setModal,setDcamp}=useT();const m=cmeta(c);const st=cstatus(c);
return(<div className='card flex flex-col gap-2'><div className='flex justify-between text-xs'><span className='bg-blue-50 rounded-full px-2 py-0.5'>{m.cat}</span><span className={st==='Active'?'text-green-700 font-semibold':'text-slate-500'}>{st}</span></div><h3 className='font-bold'>{c.name}</h3><Bar v={c.got} max={c.target} color='var(--cta)'/><div className='text-xs grid grid-cols-3 gap-1 text-slate-600'><span>Target<br/><b>{money(c.target)}</b></span><span>Collected<br/><b>{money(c.got)}</b></span><span>Remaining<br/><b>{money(Math.max(0,c.target-c.got))}</b></span></div><p className='text-xs bg-blue-50 rounded p-2'>✔ {c.crit}</p><div className='flex gap-2 mt-auto'><button className='btn bp flex-1' onClick={()=>go('campaigns',c.id)}>{t('more')}</button>{st==='Active'&&<button className='btn bc' onClick={()=>{setDcamp(c.id);setModal('donate')}}>{t('donate')}</button>}</div></div>)}

function HomeCamps(){const{camps,go,t}=useT();return(<Sec title={t('camp')} sub='Featured active campaigns.'><div className='grid md:grid-cols-3 gap-4'>{camps.filter(c=>cstatus(c)==='Active').slice(0,3).map(c=><CampCard key={c.id} c={c}/>)}</div><button className='btn bp mt-4' onClick={()=>go('campaigns')}>{t('more')}: all campaigns</button></Sec>)}

function NavCards(){const{go,t}=useT();return(<Sec title='Explore Humanity Connect' sub='Open any section for the full details.'><div className='grid sm:grid-cols-2 md:grid-cols-3 gap-4'>{NAVC.map(([p,i,a,b])=><div key={p} className='card flex flex-col gap-1'><div className='text-3xl'>{i}</div><b>{a}</b><p className='text-sm text-slate-600'>{b}</p><button className='btn bp mt-2 self-start' onClick={()=>go(p)}>{t('more')} →</button></div>)}</div></Sec>)}

function CampaignsPage(){const{camps}=useT();const[cat,setCat]=useState('All');const[st,setSt]=useState('All');const l=camps.filter(c=>(cat==='All'||cmeta(c).cat===cat)&&(st==='All'||cstatus(c)===st));
return(<Sec title='Campaigns' sub='Active and past campaigns. Open one to read the full story and see who has given.'><div className='flex gap-2 flex-wrap mb-4 items-center'>{CCATS.map(x=><Pill key={x} on={cat===x} onClick={()=>setCat(x)}>{x}</Pill>)}<span className='w-px h-6 bg-slate-300 mx-1'/>{['All','Active','Completed'].map(x=><Pill key={x} on={st===x} onClick={()=>setSt(x)}>{x}</Pill>)}</div><div className='grid md:grid-cols-3 gap-4'>{l.map(c=><CampCard key={c.id} c={c}/>)}</div>{!l.length&&<p className='text-sm text-slate-500'>No campaigns match these filters.</p>}</Sec>)}

function CampDetail(){const{camps,camp,go,donations,setModal,setDcamp}=useT();const c=camps.find(x=>x.id===camp);if(!c)return null;const m=cmeta(c);const st=cstatus(c);
const don=[...m.donors.map(n=>({n,amt:null})),...donations.filter(d=>d.camp===c.id&&d.ok).map(d=>({n:d.anon?'Anonymous':d.name,amt:d.amt}))];
return(<Sec title={c.name} sub={m.cat+' campaign · '+st}><button onClick={()=>go('campaigns')} className='text-sm font-semibold tp mb-3'>← All campaigns</button><div className='grid md:grid-cols-3 gap-4'><div className='card md:col-span-2 space-y-3'><div className='h-44 rounded bg-slate-200 flex items-center justify-center text-slate-500 text-sm'>📷 Campaign photo (sample)</div><h3 className='font-bold'>The story</h3><p className='text-sm text-slate-700'>{m.story}</p><h3 className='font-bold'>Beneficiary verification</h3><p className='text-sm bg-blue-50 rounded p-2'>✔ {c.crit}</p></div><div className='card space-y-3'><Bar v={c.got} max={c.target} color='var(--cta)'/><p className='text-sm'><b>{money(c.got)}</b> raised of {money(c.target)}<br/>Remaining: {money(Math.max(0,c.target-c.got))}</p>{st==='Active'&&<button className='btn bc w-full' onClick={()=>{setDcamp(c.id);setModal('donate')}}>Donate to this campaign</button>}<b className='text-sm block'>Donors</b>{don.map((d,i)=><div key={i} className='flex justify-between text-sm border-b py-1'><span>{d.n}</span><b>{d.amt?money(d.amt):'✔'}</b></div>)}{!don.length&&<p className='text-xs text-slate-500'>Be the first donor.</p>}</div></div></Sec>)}

function DirPro(){const{members,donations}=useT();const[q,setQ]=useState('');

function ZakatPro(){const{zakatPool,raised,setModal,setDpre}=useT();const[a,setA]=useState({cash:'',metal:'',inv:'',debt:''});const[sp,setSp]=useState(150);const n=k=>+a[k]||0;

const F=(l,k,tip)=><Fld l={<>{l}<Tip text={tip}/></>}><input className='inp' type='number' value={a[k]} onChange={e=>setA({...a,[k]:e.target.value})}/></Fld>;
return(<Sec id='zakat' title='Islamic Zakat Calculator' color='var(--zakat)' sub='Zakat is 2.5% of net eligible wealth held for a lunar year, once it reaches the nisab. Ask a scholar if unsure.'><div className='grid md:grid-cols-2 gap-4'><div className='card'><Fld l={<>Silver price per gram (৳, sample)<Tip text='Nisab is the minimum wealth before zakat is due. A common standard is the value of 612.36 g of silver (87.48 g of gold is the other standard). Enter today’s silver price in BDT; the default is only a sample.'/></>}><input className='inp' type='number' value={sp} onChange={e=>setSp(e.target.value)}/></Fld><p className='text-sm bg-purple-50 rounded p-2 mb-3'>Nisab (silver standard): <b>{money(nisab)}</b></p>{F('Cash / bank balance (৳)','cash','Money in hand, bank accounts and mobile wallets such as bKash.')}{F('Gold / silver value (৳)','metal','Current market value of gold and silver you own, including jewellery.')}{F('Investments / shares (৳)','inv','Market value of shares, savings certificates and business stock for sale.')}{F('Deductible debts (৳)','debt','Debts due soon, such as loans and unpaid bills. These are subtracted.')}</div>
<div className='card'><b className='tz'>Your zakat breakdown</b><div className='my-2'>{row('Cash / bank × 2.5%',n('cash')*0.025)}{row('Gold / silver × 2.5%',n('metal')*0.025)}{row('Investments × 2.5%',n('inv')*0.025)}{row('Debts deducted from wealth',n('debt'))}</div><p className='text-sm'>Net wealth: <b>{money(net)}</b> {net>0&&(net>=nisab?'is above the nisab.':'is below the nisab, so no zakat is due.')}</p><p className='text-3xl font-extrabold tz my-2'>{money(due)}</p><button className='btn bz w-full' disabled={!due} onClick={()=>{setDpre({amt:due,fund:'Zakat',note:'Calculated Zakat'});setModal('donate')}}>Donate Calculated Zakat Now</button><div className='mt-4 text-sm space-y-1'><div className='flex justify-between'><span>Zakat fund</span><b>{money(zakatPool)}</b></div><Bar v={zakatPool} max={zakatPool+raised} color='var(--zakat)'/><div className='flex justify-between'><span>General fund</span><b>{money(raised)}</b></div></div></div></div></Sec>)}

function AProof(){const{proofs,setProofs,log}=useT();const[f,setF]=useState({title:'',cost:'',loc:'',kind:'photo',src:null});const pick=e=>{const file=e.target.files[0];if(!file)return;setF({...f,kind:file.type.startsWith('video')?'video':'photo',src:URL.createObjectURL(file)})};
return(<div className="card max-w-xl"><b>Upload project proof</b><Fld l="Photo or video"><input type="file" accept="image/*,video/*" className="inp" onChange={pick}/></Fld>{f.src&&(f.kind==='video'?<video src={f.src} controls className="h-32 mb-2"/>:<img src={f.src} className="h-32 mb-2 rounded" alt="preview"/>)}
<Fld l="Project title"><input className="inp" value={f.title} onChange={e=>setF({...f,title:e.target.value})}/></Fld><Fld l="Cost breakdown"><input className="inp" value={f.cost} onChange={e=>setF({...f,cost:e.target.value})}/></Fld><Fld l="Location"><input className="inp" value={f.loc} onChange={e=>setF({...f,loc:e.target.value})}/></Fld>
<button className="btn bp" disabled={!f.title||!f.src} onClick={()=>{setProofs([{id:Date.now(),...f},...proofs]);log('Uploaded proof: '+f.title);setF({title:'',cost:'',loc:'',kind:'photo',src:null})}}>Publish to gallery</button></div>)}
function AExp(){const{expenses,setExpenses,log,cats}=useT();const[f,setF]=useState({proj:'',amt:'',date:new Date().toISOString().slice(0,10),loc:'',cat:'Education',receipt:null});
return(<div className="card max-w-xl"><b>Log expense</b><Fld l="Project"><input className="inp" value={f.proj} onChange={e=>setF({...f,proj:e.target.value})}/></Fld><div className="grid grid-cols-2 gap-2"><Fld l="Amount (৳)"><input className="inp" type="number" value={f.amt} onChange={e=>setF({...f,amt:e.target.value})}/></Fld><Fld l="Date"><input className="inp" type="date" value={f.date} onChange={e=>setF({...f,date:e.target.value})}/></Fld><Fld l="Location"><input className="inp" value={f.loc} onChange={e=>setF({...f,loc:e.target.value})}/></Fld><Fld l="Category"><select className="inp" value={f.cat} onChange={e=>setF({...f,cat:e.target.value})}>{cats.map(c=><option key={c[0]}>{c[0]}</option>)}</select></Fld></div>
<PhotoPick label="Receipt / bill image" onPick={r=>setF({...f,receipt:r})}/><button className="btn bp" disabled={!f.proj||!f.amt} onClick={()=>{setExpenses([...expenses,{id:Date.now(),...f,amt:+f.amt}]);log(`Logged expense ${f.proj} ৳${f.amt}`);setF({...f,proj:'',amt:'',loc:'',receipt:null})}}>Save expense</button></div>)}
function AFb(){const{fb,setFb,log}=useT();return(<div className="card">{fb.map(x=><div key={x.id} className="flex justify-between items-center gap-2 border-b py-2 text-sm"><span><b>{x.type}:</b> {x.text}</span><select className="inp !w-auto" value={x.status} onChange={e=>{setFb(fb.map(y=>y.id===x.id?{...y,status:e.target.value}:y));log(`Feedback #${x.id} → ${e.target.value}`)}}>{['Received','Under Review','Resolved'].map(s=><option key={s}>{s}</option>)}</select></div>)}</div>)}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
