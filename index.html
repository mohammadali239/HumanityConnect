function DirPro(){const{members,donations}=useT();const[q,setQ]=useState('');
const mk=(name,x)=>{const ds=donations.filter(d=>d.name===name);const b=[];if(x.cat==='Monthly Donor'||ds.some(d=>d.type==='Monthly'))b.push(['Monthly Supporter','bg-green-100 text-green-800']);if(ds.some(d=>d.fund==='Zakat'))b.push(['Zakat Donor','bg-purple-100 text-purple-800']);if(ds.length===1)b.push(['First-Time Donor','bg-amber-100 text-amber-800']);if(x.role==='Volunteer')b.push(['Volunteer','bg-blue-100 text-blue-800']);return{name,badges:b,...x}};
const mem=members.filter(m=>m.approved!==false).map(m=>mk(m.name,m));const extra=[];
const l=[...mem,...extra].filter(m=>(m.name+m.district+m.cat+m.badges.map(b=>b[0]).join(' ')).toLowerCase().includes(q.toLowerCase()));
return(<Sec id='directory' title='Member & Donor Directory' sub='Search for your own name or a badge. Donors who chose anonymity are never listed.'><input className='inp mb-3' placeholder='Search your name, district or badge...' value={q} onChange={e=>setQ(e.target.value)}/><div className='grid sm:grid-cols-2 md:grid-cols-3 gap-3'>{l.map(m=><div key={m.id} className='card flex gap-3 items-start'><Avatar m={m}/><div className='text-sm'><b>{m.name}</b><br/><span className='text-slate-500'>{m.cat}{m.district?' · '+m.district:''}</span>{m.link&&<><br/><a href={m.link} target='_blank' rel='noreferrer' className='inline-block mt-1 text-xs font-semibold tp underline'>🔗 Profile / Portfolio ↗</a></>}<div className='flex flex-wrap gap-1 mt-1'>{m.badges.map(b=><span key={b[0]} className={'text-[10px] font-semibold rounded-full px-2 py-0.5 '+b[1]}>{b[0]}</span>)}</div></div></div>)}</div>{!l.length&&<p className='text-sm text-slate-500'>No match. Check the spelling or search by district.</p>}</Sec>)}

function ZakatPro(){const{zakatPool,raised,setModal,setDpre}=useT();const[a,setA]=useState({cash:'',metal:'',inv:'',debt:''});const[sp,setSp]=useState(150);const n=k=>+a[k]||0;
const nisab=Math.round(612.36*(+sp||0));const net=Math.max(0,n('cash')+n('metal')+n('inv')-n('debt'));const due=nisab>0&&net>=nisab?Math.round(net*0.025):0;const row=(l,v)=><div className='flex justify-between text-sm border-b py-1'><span>{l}</span><b>{money(Math.round(v))}</b></div>;
const F=(l,k,tip)=><Fld l={<>{l}<Tip text={tip}/></>}><input className='inp' type='number' value={a[k]} onChange={e=>setA({...a,[k]:e.target.value})}/></Fld>;
return(<Sec id='zakat' title='Islamic Zakat Calculator' color='var(--zakat)' sub='Zakat is 2.5% of net eligible wealth held for a lunar year, once it reaches the nisab. Ask a scholar if unsure.'><div className='grid md:grid-cols-2 gap-4'><div className='card'><Fld l={<>Silver price per gram (৳, sample)<Tip text='Nisab is the minimum wealth before zakat is due. A common standard is the value of 612.36 g of silver (87.48 g of gold is the other standard). Enter today’s silver price in BDT; the default is only a sample.'/></>}><input className='inp' type='number' value={sp} onChange={e=>setSp(e.target.value)}/></Fld><p className='text-sm bg-purple-50 rounded p-2 mb-3'>Nisab (silver standard): <b>{money(nisab)}</b></p>{F('Cash / bank balance (৳)','cash','Money in hand, bank accounts and mobile wallets such as bKash.')}{F('Gold / silver value (৳)','metal','Current market value of gold and silver you own, including jewellery.')}{F('Investments / shares (৳)','inv','Market value of shares, savings certificates and business stock for sale.')}{F('Deductible debts (৳)','debt','Debts due soon, such as loans and unpaid bills. These are subtracted.')}</div>
<div className='card'><b className='tz'>Your zakat breakdown</b><div className='my-2'>{row('Cash / bank × 2.5%',n('cash')*0.025)}{row('Gold / silver × 2.5%',n('metal')*0.025)}{row('Investments × 2.5%',n('inv')*0.025)}{row('Debts deducted from wealth',n('debt'))}</div><p className='text-sm'>Net wealth: <b>{money(net)}</b> {net>0&&(net>=nisab?'is above the nisab.':'is below the nisab, so no zakat is due.')}</p><p className='text-3xl font-extrabold tz my-2'>{money(due)}</p><button className='btn bz w-full' disabled={!due} onClick={()=>{setDpre({amt:due,fund:'Zakat',note:'Calculated Zakat'});setModal('donate')}}>Donate Calculated Zakat Now</button><div className='mt-4 text-sm space-y-1'><div className='flex justify-between'><span>Zakat fund</span><b>{money(zakatPool)}</b></div><Bar v={zakatPool} max={zakatPool+raised} color='var(--zakat)'/><div className='flex justify-between'><span>General fund</span><b>{money(raised)}</b></div></div></div></div></Sec>)}

const LV=[[500,'📚','1 month of books & stationery for a student'],[2000,'🧺','a family food basket for two weeks'],[10000,'🩺','a medical kit and check-ups for 20 patients'],[25000,'🎓','a half-year scholarship for one student']];

function DonorExtras(){const{me,donations}=useT();const curYr=String(new Date().getFullYear());const[yr,setYr]=useState(curYr);const[moSel,setMoSel]=useState('ALL');const MOS=['January','February','March','April','May','June','July','August','September','October','November','December'];const yrs=[...new Set([curYr,'2027','2025',...donations.filter(d=>d.ts).map(d=>String(new Date(d.ts).getFullYear()))])].sort((a,b)=>b.localeCompare(a));const q=(me.name||'').trim().toLowerCase();const matchQ=d=>!q||d.name.toLowerCase().includes(q)||d.id.toLowerCase().includes(q);const mine=donations.filter(d=>d.ok&&matchQ(d));const total=me.monthly.reduce((s,v)=>s+v,0)+mine.reduce((s,d)=>s+d.amt,0);const stu=Math.floor(total/1000);const MS=[1,4,10,25];const next=MS.find(m=>m>stu)||MS[MS.length-1];const getD=d=>d.ts?new Date(d.ts):new Date();const list=donations.filter(d=>{const dt=getD(d);const yrOk=yr==='ALL'||(!d.ts&&yr===curYr)||(d.ts&&String(dt.getFullYear())===yr);const moOk=moSel==='ALL'||(d.ts&&String(dt.getMonth())===moSel);return matchQ(d)&&yrOk&&moOk;});const tot=list.reduce((a,b)=>a+Number(b.amt||0),0);
return(<div className='max-w-6xl mx-auto px-4 pb-8 grid md:grid-cols-2 gap-4'><div className='card'><b className='tp'>Your impact milestones</b><p className='text-2xl font-extrabold mt-1'>You have helped {stu} student{stu===1?'':'s'} this year!</p><p className='text-xs text-slate-500 mb-3'>Estimated: every ৳1,000 supports one student for a month (demo).</p><Bar v={stu} max={next}/><div className='flex justify-between mt-3 text-center text-xs'>{MS.map(m=><div key={m}><div className={'mx-auto w-9 h-9 rounded-full flex items-center justify-center font-bold '+(stu>=m?'bg-green-600 text-white':'bg-slate-200')}>{stu>=m?'✔':m}</div>{m} student{m>1?'s':''}</div>)}</div></div><div className='card'><b className='tp'>Annual & Monthly donation summary</b><p className='text-sm text-slate-600 my-2'>Select a year and month to download your official donation statement.</p><div className='flex gap-2 items-center flex-wrap'><select className='inp !w-auto font-semibold' value={yr} onChange={e=>setYr(e.target.value)}>{yrs.map(y=><option key={y} value={y}>{y}</option>)}<option value='ALL'>All Years</option></select><select className='inp !w-auto font-semibold' value={moSel} onChange={e=>setMoSel(e.target.value)}><option value='ALL'>All Months (Annual)</option>{MOS.map((m,i)=><option key={m} value={String(i)}>{m}</option>)}</select><button className='btn bp' disabled={!list.length} onClick={()=>{const fmtDate=d=>(d.t==='just now'&&d.ts)?new Date(d.ts).toLocaleString():d.t;const isMonthly=moSel!=='ALL';const titleTxt=isMonthly?'MONTHLY DONATION SUMMARY ('+MOS[Number(moSel)].toUpperCase()+' '+(yr==='ALL'?'ALL YEARS':yr)+')':'ANNUAL DONATION SUMMARY ('+(yr==='ALL'?'ALL YEARS':yr)+')';const totLbl=isMonthly?'Total Monthly Contribution:':'Total Annual Contribution:';const w=window.open('','_blank');w.document.open();w.document.write('<!DOCTYPE html><html><head><title>'+titleTxt+'</title><style>@page{size:A4;margin:15mm}body{font-family:Georgia,serif;color:#073788;max-width:780px;margin:0 auto;padding:20px}.hdr{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #073788;padding-bottom:12px;margin-bottom:18px}.ttl{background:#073788;color:#fff;text-align:center;padding:8px;font-weight:bold;letter-spacing:1.5px;border-radius:6px;margin-bottom:18px;font-size:15px;-webkit-print-color-adjust:exact;print-color-adjust:exact}table{width:100%;border-collapse:collapse;margin-bottom:18px;font-family:Arial,sans-serif;font-size:12.5px;color:#1e293b}thead{display:table-header-group}tr{break-inside:avoid;page-break-inside:avoid}th{background:#e0f0ff;color:#073788;text-align:left;padding:9px;border-bottom:2px solid #073788;-webkit-print-color-adjust:exact;print-color-adjust:exact}td{padding:8px 9px;border-bottom:1px solid #cbd5e1}.tot{text-align:right;font-size:16px;font-weight:bold;margin-top:10px;color:#073788;break-inside:avoid}.box{background:#e8f2ff;padding:11px 15px;border-radius:8px;margin-top:20px;font-style:italic;font-size:12.5px;break-inside:avoid;-webkit-print-color-adjust:exact;print-color-adjust:exact}.ftr{margin-top:35px;display:flex;justify-content:space-between;align-items:flex-end;border-top:2px solid #073788;padding-top:12px;font-size:11px;font-family:Arial,sans-serif;break-inside:avoid}</style></head><body><div class="hdr"><div style="display:flex;align-items:center;gap:14px"><img src="Logo.png" style="width:60px;height:60px;object-fit:contain"/><div><h2 style="margin:0;font-size:24px">Humanity Connect</h2><p style="margin:2px 0 0;font-size:12px;font-style:italic;color:#1e40af">Together for a kinder, fairer and better world</p></div></div><div style="text-align:right;font-size:12px;font-family:Arial,sans-serif;color:#1e293b"><b>Donor:</b> '+(me.name||'All Donors')+'<br/><b>Category:</b> '+(me.cat||'General')+'<br/><b>Total Entries:</b> '+list.length+'<br/><b>Issued:</b> '+new Date().toLocaleDateString()+'</div></div><div class="ttl">'+titleTxt+'</div><table><thead><tr><th>SL</th><th>Receipt ID</th><th>Date & Time</th><th>Fund</th><th>Method</th><th>Status</th><th style="text-align:right">Amount</th></tr></thead><tbody>'+list.map((d,idx)=>'<tr><td>'+(idx+1)+'</td><td><b>'+d.id+'</b></td><td>'+fmtDate(d)+'</td><td>'+d.fund+'</td><td>'+(d.method||'Online')+'</td><td>'+(d.ok?'Verified':'Pending')+'</td><td style="text-align:right"><b>৳'+d.amt+'</b></td></tr>').join('')+'</tbody></table><div class="tot">'+totLbl+' ৳'+tot+'</div><div class="box">With your support, we can bring hope, spread kindness, and build a more compassionate society.<br/><b>Together, we can make a difference!</b></div><div class="ftr"><div>🌐 https://humanityconnect.netlify.app<br/>✉️ humanityconnect12@gmail.com &nbsp;|&nbsp; 📍 Dhaka, Bangladesh</div><div style="text-align:center"><div style="border-top:2px solid #073788;width:160px;padding-top:5px"><b>Authority</b><br/>Humanity Connect</div></div></div><'+'script>window.onload=function(){setTimeout(function(){window.print();},300);};window.onafterprint=function(){window.close();};<'+'/script></body><'+'/html>');w.document.close();}}>Download Summary</button></div><p className={'text-xs font-semibold mt-2 '+(list.length?'text-green-700':'text-amber-700')}>{list.length?`✔ ${list.length} donation(s) found (Total: ${money(tot)})`:'ℹ No donations recorded for this selected period.'}</p></div></div>);}

function Contact(){
  const [f, setF] = useState({name:'', email:'', msg:''});
  const [status, setStatus] = useState('');
  const mail = 'humanityconnect12@gmail.com';

  const sendMsg = async () => {
    setStatus('sending');
    try {
      const res = await fetch('https://formspree.io/f/mvkarnpd', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({ name: f.name, email: f.email, message: f.msg })
      });
      if (res.ok) {
        setStatus('ok');
        setF({name:'', email:'', msg:''});
      } else {
        setStatus('err');
      }
    } catch (e) {
      setStatus('err');
    }
  };

  return (
    <Sec id="contact" title="Contact Us" sub="Questions, partnerships or need help? Reach us any of these ways.">
      <div className="grid md:grid-cols-2 gap-4">
        <div className="card space-y-3 text-sm">
          <a className="block font-semibold tp" href={'mailto:'+mail}>✉ {mail}</a>
          <a className="block font-semibold tp" href="tel:01977853550">📞 01977853550</a>
          <a className="block font-semibold tp" href="https://wa.me/8801977853550" target="_blank" rel="noreferrer">💬 Chat on WhatsApp</a>
          <a className="block font-semibold tp" href="https://www.facebook.com/share/19oERSrLHM/?mibextid=wwXIfr" target="_blank" rel="noreferrer">📘 Connect on Facebook</a>
          <p className="text-slate-500">Dhaka, Bangladesh</p>
        </div>
        <div className="card">
          <Fld l="Your name"><input className="inp" value={f.name} onChange={e=>setF({...f,name:e.target.value})}/></Fld>
          <Fld l="Your email"><input className="inp" type="email" value={f.email} onChange={e=>setF({...f,email:e.target.value})}/></Fld>
          <Fld l="Message"><textarea className="inp" rows="3" value={f.msg} onChange={e=>setF({...f,msg:e.target.value})}/></Fld>
          <button className="btn bp" disabled={!f.name || !f.msg || status==='sending'} onClick={sendMsg}>
            {status==='sending' ? 'Sending...' : 'Send message'}
          </button>
          {status==='ok' && <p className="text-sm text-green-700 font-semibold mt-2">✔ Message sent! Thank you for contacting us.</p>}
          {status==='err' && <p className="text-sm tb mt-2">Something went wrong. Please try again or use WhatsApp.</p>}
        </div>
      </div>
    </Sec>
  );
}

function AExp(){const{expenses,setExpenses,log,cats}=useT();const[f,setF]=useState({proj:'',amt:'',date:new Date().toISOString().slice(0,10),loc:'',cat:'Education',receipt:null});const[busy,setBusy]=useState(false);const[msg,setMsg]=useState('');

function AScholars(){

        <b>✅ Verified & Live Student Cards ({active.length})</b>
        <div className='space-y-2 mt-2'>
          {active.map(s=>(
            <div key={s.id} className='flex items-center justify-between border-b py-2 text-sm'>
              <div>
                <b>Student #{s.n}</b> ({s.name}) — <span className='text-xs text-slate-500'>{s.cls}, {s.d} · GPA {s.gpa} · Target: {money(s.amt)}/mo</span>
              </div>
              {adminOK&&<button className='text-xs tb font-bold' onClick={()=>remove(s)}>Remove</button>}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
